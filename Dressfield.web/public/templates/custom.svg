<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer dashed border -->
  <rect x="40" y="40" width="320" height="320" rx="16"
        stroke="#9CA3AF" stroke-width="2" stroke-dasharray="10,6" fill="#F9FAFB"/>
  <!-- Plus symbol -->
  <line x1="200" y1="160" x2="200" y2="240" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="200" x2="240" y2="200" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <!-- Corner accent marks -->
  <path d="M55 70 L55 55 L70 55" stroke="#B0B8C5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M345 70 L345 55 L330 55" stroke="#B0B8C5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M55 330 L55 345 L70 345" stroke="#B0B8C5" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M345 330 L345 345 L330 345" stroke="#B0B8C5" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Design zone -->
  <rect id="design-zone" data-design-zone="true" x="60" y="60" width="280" height="280"
        fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
</svg>
